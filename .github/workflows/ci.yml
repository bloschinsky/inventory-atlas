name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
        env:
          POSTGRES_USER: inventory_atlas
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: inventory_atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventory_atlas -d inventory_atlas_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
      - run: npm install --global corepack@0.36.0
      - run: corepack enable && corepack install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm license:check
      - run: pnpm security:check
      - run: pnpm prisma:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:integration
        env:
          INTEGRATION_DATABASE_URL: postgresql://inventory_atlas:integration-only@localhost:5432/inventory_atlas_test
      - run: pnpm build
      - run: docker build --file infra/docker/backend.Dockerfile --target api --tag inventory-atlas-runtime-check .
      - run: docker run --rm --network none inventory-atlas-runtime-check node scripts/check-runtime-smoke.mjs
