<?xml version="1.0" encoding="UTF-8"?>
<!--
  Standalone custom 50 x 30 mm label proof (HND-03). The SVG canvas is declared
  in millimetres so it prints at actual physical size. Dashed boxes mark the QR
  and Code 128 areas; the real symbols are rendered server-side in LAB-02.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="50mm" height="30mm" viewBox="0 0 50 30">
  <rect x="0.1" y="0.1" width="49.8" height="29.8" fill="#ffffff" stroke="#000000" stroke-width="0.2"/>
  <!-- QR area: 22 x 22 mm -->
  <rect x="2" y="4" width="22" height="22" fill="none" stroke="#000000" stroke-width="0.2" stroke-dasharray="1,0.6"/>
  <text x="13" y="15.5" font-family="Arial, sans-serif" font-size="2.5" text-anchor="middle">QR</text>
  <!-- Human code -->
  <text x="26" y="8" font-family="'Courier New', monospace" font-size="3">IA-000-DEMO</text>
  <!-- Code 128 area -->
  <rect x="26" y="11" width="22" height="8" fill="none" stroke="#000000" stroke-width="0.2" stroke-dasharray="1,0.6"/>
  <text x="37" y="15.5" font-family="Arial, sans-serif" font-size="2" text-anchor="middle">Code 128</text>
</svg>
